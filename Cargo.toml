[workspace]
resolver = "2"
members = ["crates/rea-core", "crates/rea-mcp", "crates/rea-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jlien/rea-rs"
rust-version = "1.75"

[workspace.dependencies]
goblin = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
capstone = "0.13"

[profile.release]
lto = true
strip = true
